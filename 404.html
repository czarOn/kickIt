<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KickIt</title>
  <script>
    // Phones and chat apps often lowercase links; the site path is case-sensitive.
    const fixed = location.pathname.replace(/^\/kickit(?=\/|$)/i, "/kickIt");
    if (fixed !== location.pathname) location.replace(fixed + location.search + location.hash);
  </script>
  <style>body { font-family: system-ui, sans-serif; background: #0f141b; color: #e8eef5; padding: 32px; }</style>
</head>
<body>
  <h1>Nie znaleziono strony</h1>
  <p><a href="/kickIt/" style="color:#ffd37a">Przejdź do KickIt</a></p>
</body>
</html>
